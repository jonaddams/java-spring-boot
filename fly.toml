# Fly.io config. App names are global on Fly: if this one is taken, change it
# here or pass --app.
#   fly launch --no-deploy --copy-config      # first time only
#   fly secrets set NUTRIENT_LICENSE_KEY=... CORS_ALLOWED_ORIGINS=https://your-frontend
#   fly deploy                                # remote builder builds the Dockerfile (amd64)
#   curl https://<app>.fly.dev/api/health     # warm it: a deploy discards the suspend snapshot
app = "nutrient-java-sdk-api"
primary_region = "iad"

[http_service]
  internal_port = 8080
  force_https = true
  # Scale to zero with suspend: storage-only cost while idle, and a resume in
  # a few hundred ms instead of a JVM + Spring cold start.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"

# A dedicated core, not shared: on Fly, shared-cpu-1x ran out of burst credit
# and throttled document processing from seconds to minutes (measured on the
# .NET backend). With scale to zero it is billed per second only while running.
# 4 GB, measured on Fly: at 2 GB the kernel OOM-killed Java (anon-rss 1.9 GB)
# during OCR after HTML, because the VM's 2 GB also holds the kernel and Chrome.
# 4 GB ran HTML, OCR, ICR and the rest twice with no OOM. Suspend still works
# above Fly's 2 GB guideline here: resume took 0.7 s, then HTML->PDF 2.4 s.
[[vm]]
  size = "performance-1x"
  memory = "4gb"
